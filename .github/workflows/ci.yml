name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Swift build and test
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: MVP verifier
        run: swift run OpenMarkedVerifier

      - name: Visual snapshots
        run: Scripts/verify_visual_snapshots.sh

      - name: Export artifacts
        run: Scripts/verify_export_artifacts.sh

      - name: Test
        run: swift test
